name: Render keep-alive
# Mantem o servidor reserva do Render acordado (plano free dorme apos 15 min).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 60 https://smartequa-template-api.onrender.com/api/pix/check || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Render nao respondeu 200"